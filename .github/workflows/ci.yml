name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Build BEFORE test — the package is ESM-only with subpath exports
      # (./mcp, ./testing, ./testing/lint) resolved from dist/; publint and
      # attw below also need a built dist/ to inspect.
      - run: npm run build
      - run: npm test
      # Coverage is enforced at 100% on all four metrics (vitest.config.ts
      # thresholds). It runs HERE and not only on a contributor's machine for
      # the same reason the test-count badge has a gate: a number nobody checks
      # is not a fact. Without this step the thresholds are a local convention
      # that a green pipeline silently stops enforcing.
      - run: npm run test:coverage
      # Packaging-correctness gate: the published artifact resolves cleanly.
      - run: npx publint
      # esm-only profile: this package ships no CJS build (type: module,
      # exports have no "require" condition) — the node10/CJS-consumer
      # checks in attw's default "strict" profile don't apply here and
      # would flag the ESM-only design as an error.
      - run: npx @arethetypeswrong/cli --pack --profile esm-only

  # Docs build gate — builds the nested Fumadocs app (docs-next/). Two anti-drift
  # layers ride this job:
  #   • check:api — regenerates the committed API reference from source and
  #     `git diff --exit-code`s it, so a changed export can never leave a stale
  #     committed page. (Wired here FOR REAL — the generator's freshness contract
  #     is this job, not a comment.)
  #   • the Next build twoslash-compiles every ```ts twoslash guide snippet
  #     against the BUILT library types, so a renamed API fails CI, not the reader.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Root deps carry typedoc for the API generator; `prepare` builds dist/,
      # but the explicit build below is the load-bearing step (twoslash and the
      # file:.. dep resolve the library's types from dist/) — never silently
      # rely on an install hook for it.
      - run: npm ci
      - run: npm run build

      - name: Install docs-next deps
        working-directory: docs-next
        run: npm ci

      # Docs-truth gate — does the hand-written documentation describe what the
      # package actually SHIPS? Reads package.json `exports`, resolves each of
      # the six entry points to its built .d.ts, and enumerates real exported
      # symbols (TypeDoc sees only the root barrel, so five subpaths would be
      # invisible to a TypeDoc-shaped check). The generated API pages are
      # deliberately EXCLUDED from "documented": they are produced from the
      # source, so counting them marks everything documented and every gap
      # vanishes. Improving is free; this fails only when a symbol STOPS being
      # described in prose.
      - name: Documentation still describes the shipped surface
        run: npm run docs:truth:check

      - name: Generated API reference is fresh
        working-directory: docs-next
        run: npm run check:api

      - name: Build docs-next (twoslash-gates every code block)
        working-directory: docs-next
        run: npm run build

  # Doc-links gate — every internal cross-reference in docs-next must resolve.
  # Hand-written guides link by stable id (doc:<id>, resolved at build by
  # docs-next/lib/remark-doc-links.mjs); this re-derives the id->route index
  # from the filesystem and fails on any dead id, dead path, or stale #anchor —
  # including the README's absolute links into the live site (the front-door
  # gate). The same check runs inside `npm test` (test/docs/); this job is the
  # fast, dependency-light mirror.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: the checker needs only github-slugger from the root
      # devDependencies — skip the prepare build.
      - run: npm ci --ignore-scripts
      - run: node scripts/check-doc-links.mjs --strict
