name: Native source cohort

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_FETCH_RETRIES: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  file-size:
    uses: footprintjs/ci/.github/workflows/file-size.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  structure-advisory:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  native-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: hci-native/source
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Read exact source and target admission before npm setup
        working-directory: hci-native/source
        env:
          HCI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          HCI_SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/cohort/native_input.mjs preflight
      # npm10's fresh peer resolver can crash before strict installation on Node22.
      # Keep the same supported, exact package manager in both native contexts.
      - name: Pin the native package manager
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Original input, strict native contexts and every HCI gate
        working-directory: hci-native/source
        env:
          GH_TOKEN: ${{ github.token }}
          HCI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          HCI_SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
          HCI_NODE_MAJOR: ${{ matrix.node }}
        run: node scripts/cohort/native_input.mjs
      - name: Retain actual source, input, graph, command and restoration proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hcifootprint-native-${{ matrix.node }}-${{ github.event.pull_request.head.sha }}
          path: |
            hci-native/proof/
            hci-native/inputs/original-source.zip
            hci-native/pack/
            hci-native/npm-cache/_logs/
          if-no-files-found: error

  proof-view:
    name: ${{ matrix.name }}
    needs: native-source
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { view: test, node: '22', name: test }
          - { view: docs, node: '22', name: docs }
          - { view: docs-links, node: '22', name: docs-links }
          - { view: installed-cohort, node: '22', name: 'installed-cohort (22)' }
          - { view: installed-cohort, node: '24', name: 'installed-cohort (24)' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: hci-native/source
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Read exact source and target admission before proof access
        working-directory: hci-native/source
        env:
          HCI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          HCI_SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/cohort/native_input.mjs preflight
      - name: Verify actual same-run source compatibility proof, not registry readiness
        working-directory: hci-native/source
        env:
          GH_TOKEN: ${{ github.token }}
          HCI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          HCI_SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
          HCI_EXECUTORS_RESULT: ${{ needs.native-source.result }}
          HCI_VIEW_NODE: ${{ matrix.node }}
        run: node scripts/cohort/native_input.mjs view-${{ matrix.view }}
