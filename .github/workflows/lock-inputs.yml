name: Hosted lock inputs (report)

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - demos/live-desk/package.json
      - demos/onboarding-wizard/package.json
      - docs-next/package.json
      - docs-next/package-lock.json
      - .github/workflows/lock-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '0'

jobs:
  lock-inputs:
    name: lock-inputs (report)
    # Hosted npm proposes a full tool refresh by regenerating both locks.
    # This report is not migration lock generation or compatibility acceptance.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          # Node22's bundled npm10 crashed during the prior fresh peer resolution.
          # Preparation uses Node24's bundled package manager; source checks still
          # consume the committed result in both of their own native environments.
          node-version: 24
          cache: npm
      - name: Retain the exact source commit, without a clock-based identity
        run: |
          mkdir -p "$RUNNER_TEMP/hci-lock-inputs/docs-next"
          git rev-parse HEAD > "$RUNNER_TEMP/hci-lock-inputs/source-head.txt"
          printf '%s\n' '{"repository":"footprintjs/hcifootprint","rootLockSource":"package-lock.json","docsLockSource":"docs-next/package-lock.json"}' > "$RUNNER_TEMP/hci-lock-inputs/source-paths.json"
      - name: Start the hosted proposal from both current authored manifests
        # Old lock entries can retain an obsolete alias or peer family even after
        # its manifest changes. Only this disposable checkout drops the two locks;
        # Git preserves their source bytes, and ordinary CI still uses npm ci.
        run: rm -- package-lock.json docs-next/package-lock.json
      - name: Generate the normal root and workspace lock
        run: npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Generate the normal self-docs lock
        working-directory: docs-next
        run: npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Lock preparation must not rewrite authored manifests
        run: git diff --exit-code -- package.json docs-next/package.json demos/live-desk/package.json demos/onboarding-wizard/package.json
      - name: Stage the unchanged generated bytes with their source provenance
        run: |
          cp package-lock.json "$RUNNER_TEMP/hci-lock-inputs/package-lock.json"
          cp docs-next/package-lock.json "$RUNNER_TEMP/hci-lock-inputs/docs-next/package-lock.json"
      - name: Retain actual generated locks and their source head
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lock-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hci-lock-inputs/
          if-no-files-found: error
