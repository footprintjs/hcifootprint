name: Runtime cohort

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: scripts/cohort

jobs:
  file-size:
    uses: footprintjs/ci/.github/workflows/file-size.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  structure-advisory:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  installed-cohort:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Required checks consume only this commit's normal root/workspace lock.
      - run: npm ci --ignore-scripts --strict-peer-deps
      # After the install: check-pins reads ranges with the `semver` devDependency.
      - run: npm run test:cohort:pins
      - run: npm run test:cohort
      - run: npm run build
      - run: node scripts/cohort/identity.mjs --workspaces .
      - run: npm run test:package
      - name: The actual packed manifest and members match this source and build
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/hci-own-packed.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from native_input.pack import inspect_hci_pack
          root = Path.cwd()
          temporary = Path(os.environ['RUNNER_TEMP'])
          reports = json.loads((temporary / 'hci-own-packed.json').read_text())
          if type(reports) is not list or len(reports) != 1:
              raise ValueError('Expected the one actual HCI pack report')
          reported = reports[0]
          archive = temporary / reported['filename']
          authored = json.loads((root / 'package.json').read_text())
          facts = inspect_hci_pack(root, archive, reported, authored)
          print(json.dumps({key: facts[key] for key in ['kind', 'archive', 'package', 'entryCount', 'distFiles']}, sort_keys=True))
          PY
      - run: git diff --exit-code

  compatibility-report:
    name: published compatibility report (${{ matrix.node }})
    # The demos and fresh consumer keep all their assertions. A new external
    # package selection is a report, never a condition for this commit's gates.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the root and demo workspace graph normally
        run: npm ci --strict-peer-deps
      # After the install: check-pins reads ranges with the `semver` devDependency.
      - name: Declared cohort and normal locks
        run: npm run test:cohort:pins
      - name: Identity checker fault cases
        run: npm run test:cohort
      - run: npm run build
      - name: Root and both demos share physical core packages
        run: node scripts/cohort/identity.mjs --workspaces .
      - name: Verify live desk with its scripted provider
        run: npm run verify --workspace live-desk
      - name: Verify onboarding with its scripted provider
        run: npm run verify --workspace onboarding-wizard-demo
      - name: Pack the actual build and prepare a fresh consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/hci-packed.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { prepareConsumer } from './scripts/cohort/prepare-consumer.mjs';
          const [packed] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'hci-packed.json'), 'utf8'));
          prepareConsumer(join(process.env.RUNNER_TEMP, 'hci-consumer'), join(process.env.RUNNER_TEMP, packed.filename));
          NODE
      - name: Install packed HCI and actual public dependencies normally
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm install --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Reject extra physical engine or record packages
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:identity
      - name: Typecheck every packed public import
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:types
      - name: Real packed action, record and serving contracts
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:runtime
