name: Runtime cohort

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '0'

jobs:
  file-size:
    uses: footprintjs/ci/.github/workflows/file-size.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  structure-advisory:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@4537c3701819ba397282fc6c22f00c6cfbc7b714
    with:
      tool_sha: 4537c3701819ba397282fc6c22f00c6cfbc7b714

  installed-cohort:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the root and demo workspace graph normally
        run: npm ci --strict-peer-deps
      # After the install: check-pins reads ranges with the `semver` devDependency.
      - name: Declared cohort and normal locks
        run: npm run test:cohort:pins
      - name: Identity checker fault cases
        run: npm run test:cohort
      - run: npm run build
      - name: Root and both demos share physical core packages
        run: node scripts/cohort/identity.mjs --workspaces .
      - name: Verify live desk with its scripted provider
        run: npm run verify --workspace live-desk
      - name: Verify onboarding with its scripted provider
        run: npm run verify --workspace onboarding-wizard-demo
      - name: Pack the actual build and prepare a fresh consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/hci-packed.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { prepareConsumer } from './scripts/cohort/prepare-consumer.mjs';
          const [packed] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'hci-packed.json'), 'utf8'));
          prepareConsumer(join(process.env.RUNNER_TEMP, 'hci-consumer'), join(process.env.RUNNER_TEMP, packed.filename));
          NODE
      - name: Install packed HCI and actual public dependencies normally
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm install --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Reject extra physical engine or record packages
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:identity
      - name: Typecheck every packed public import
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:types
      - name: Real packed action, record and serving contracts
        working-directory: ${{ runner.temp }}/hci-consumer
        run: npm run check:runtime
