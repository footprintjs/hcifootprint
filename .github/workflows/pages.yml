name: Deploy site to GitHub Pages

# ONE Pages deployment per repo — this workflow ALWAYS builds BOTH apps and
# uploads a single assembled artifact:
#   site/       → the storydeck home  at /hcifootprint/          (Next 15 export)
#   docs-next/  → the Fumadocs docs   at /hcifootprint/docs/     (Next 16 export)
# The docs export is copied UNDER the home's out/ (out/docs). Each app exports
# with its own basePath, so each keeps its _next/ under its own URL prefix —
# zero collisions, and the home's bytes are untouched by the copy (it only ADDS
# the docs/ subtree). Never add a second Pages workflow: a docs-only deploy
# would DELETE the live home (one artifact per repo).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-next/**'
      - 'src/**' # the API reference is generated from source
      - 'scripts/gen-fumadocs-api.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The library itself: docs-next's twoslash code-checks and the generated
      # API reference both resolve against hcifootprint's built types (dist/).
      # `prepare` builds on install, but the explicit build is load-bearing —
      # never silently rely on an install hook.
      - name: Install library deps (docs-next resolves hcifootprint via file:..)
        run: npm ci
      - name: Build library (dist types for twoslash + API gen)
        run: npm run build

      # `storydeck` is a public github: dependency (ships source) — npm install resolves it directly,
      # so no sibling checkout is needed. `npm install` (not `npm ci`) works with or without a lockfile.
      - name: Install home deps
        working-directory: site
        run: npm install

      - name: Build the storydeck home (next build → site/out)
        working-directory: site
        run: npm run build

      - name: Install docs deps
        working-directory: docs-next
        run: npm ci

      # Static export with the docs mount point. EXPORT=true flips next.config
      # to output:'export'; NEXT_PUBLIC_BASE_PATH feeds both the router basePath
      # and lib/site.ts asset() so every URL is correctly prefixed. These two
      # values and the copy destination below move TOGETHER (see next.config.mjs
      # "DEPLOY GEOMETRY").
      - name: Build docs static export (next build → docs-next/out)
        working-directory: docs-next
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: '/hcifootprint/docs'
        run: npm run build

      - name: Assemble ONE artifact — docs mounted under the home
        run: cp -R docs-next/out site/out/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
